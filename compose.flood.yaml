services:
  flood-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, uvicorn, backend.flood.api:app, --host, 0.0.0.0, --port, "8100"]
    ports: ["127.0.0.1:8100:8100"]
    volumes: ["./runtime/flood:/app/runtime/flood"]
    environment:
      FLOOD_ADMIN_TOKEN: ${FLOOD_ADMIN_TOKEN:-}
      FLOOD_ORIGINS: ${FLOOD_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    restart: unless-stopped
  flood-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, backend.flood.worker]
    volumes: ["./runtime/flood:/app/runtime/flood"]
    environment:
      FLOOD_INTERVAL: ${FLOOD_INTERVAL:-60}
      FLOOD_DEVICE: cpu
    restart: unless-stopped
